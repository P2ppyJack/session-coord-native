name: session-coord-native
version: 0.4.0
manifest_version: 2
api_version: 1
kind: standalone
description: Deliver exact session-coord wake events as Hermes turns
license: MIT
homepage: https://github.com/P2ppyJack/session-coord-native
requires_hermes: ">=0.23.3"
platforms:
  - linux
  - macos
python_dependencies: []
# Registered only by the stock-host (inject) delivery path; the native path registers none.
provides_hooks:
  - pre_llm_call
  - on_session_start
  - on_session_open
  - on_session_end
  - on_session_reset
  - on_session_delete
  - on_session_finalize
  - post_tool_call
tags:
  - coordination
  - continuation
  - native-turn-source
config_schema:
  board_script:
    type: str
    default: ""
    description: Optional absolute path to session_coord.py; empty uses the machine root scripts directory.
  supported_surfaces:
    type: list
    default:
      - cli
      - tui
      - gateway
    description: Native Hermes surfaces on which coordination turns may be admitted.
  delivery:
    type: str
    default: auto
    description: "auto, native, or inject. auto uses the host's native-turn-source registrar when present, otherwise the public inject_message API."
