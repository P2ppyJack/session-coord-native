name: Native plugin tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: P2ppyJack/hermes-agent
          ref: 6b7a3ef05121c8b27598898c0b181b6a209b8889
          path: hermes
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: P2ppyJack/session-coord
          ref: 1d2396f1b1378592cb9a3d16488e902e7ba403d6
          path: board
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install compatible host test dependencies
        run: python -m pip install -e "${{ github.workspace }}/hermes[dev]"
      - name: Validate plugin manifest and registration
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-validation-home
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes plugins validate . --json
      - name: Verify optional plugin
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
          PYTHONPATH: ${{ github.workspace }}/hermes
          SESSION_COORD_TEST_HERMES_ROOT: ${{ github.workspace }}/hermes
          SESSION_COORD_TEST_BOARD_INSTALLER: ${{ github.workspace }}/board/install.py
          SESSION_COORD_TEST_BOARD_SCRIPT: ${{ github.workspace }}/board/skills/multi-session-coordination/scripts/session_coord.py
        run: python -m pytest -q tests
